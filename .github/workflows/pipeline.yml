name: CI - Build e Testes

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v5

      - name: Configurar o Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Compilar, rodar os testes e gerar o .jar
        run: mvn -B package

      - name: Publicar o .jar gerado
        uses: actions/upload-artifact@v5
        with:
          name: monitoramento-maquinas-jar
          path: target/*.jar
